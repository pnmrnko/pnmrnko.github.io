<header class="masthead">
  <h3 class="masthead-title">
    <a href="{{ site.Home.RelPermalink }}" title="{{ i18n "home" }}">{{ site.Title }}</a>
    {{ with site.Params.tagline }}<small>{{ . }}</small>{{ end }}
  </h3>
  <nav class="masthead-nav" aria-label="{{ i18n "mainNav" }}">
    {{- $current := . }}
    {{- range slice "archive" "about" }}
      {{- with site.GetPage . }}
    <a href="{{ .RelPermalink }}"{{ if eq . $current }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a>
      {{- end }}
    {{- end }}
    {{ partial "language-switch.html" . }}
  </nav>
</header>
