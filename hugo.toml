baseURL = "https://pnmrnko.github.io/"
defaultContentLanguage = "uk"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 5

[permalinks.page]
  posts = "/:year/:month/:slug/"

[outputFormats.atom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  isPlainText = false
  rel = "alternate"

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputs]
  home = ["html", "atom"]
  section = ["html"]
  page = ["html"]

[languages.uk]
  locale = "uk-UA"
  label = "Українська"
  weight = 1
  title = "pnmrnko"
  [languages.uk.params]
    tagline = "Життя і сміття С.\u00a0Пономаренка"
    description = "Особистий блог."
    ogLocale = "uk_UA"

[languages.en]
  locale = "en-US"
  label = "English"
  weight = 2
  title = "pnmrnko"
  [languages.en.params]
    tagline = "Life and Lies of S.\u00a0Ponomarenko"
    description = "Personal blog."
    ogLocale = "en_US"

[params]
  author = "pnmrnko"
  repo = "https://github.com/pnmrnko/pnmrnko.github.io"

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.parser.attribute]
  block = true

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[sitemap]
  changeFreq = ""
  priority = -1

[markup.goldmark.extensions.extras.mark]
  enable = true

# LaTeX between these delimiters is passed through untouched and turned into
# MathML at build time by layouts/_markup/render-passthrough.html.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]
